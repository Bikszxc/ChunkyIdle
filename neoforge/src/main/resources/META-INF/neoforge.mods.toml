modLoader = "javafml"
loaderVersion = "${loader_version}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
mandatory = true
versionRange = "[1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional/soft dependency - see neoforge/build.gradle.kts.
[[dependencies.${mod_id}]]
modId = "cloth-config"
type = "optional"
mandatory = false
ordering = "NONE"
side = "BOTH"
