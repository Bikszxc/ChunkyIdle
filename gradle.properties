# ── Gradle ────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# ── Mod identity (shared by every Minecraft version / loader) ─────────────
# Rename these to match your mod - they flow into fabric.mod.json,
# META-INF/mods.toml and META-INF/neoforge.mods.toml at build time (see the
# `processResources` block in fabric/, forge/ and neoforge/'s build.gradle.kts).
# See README.md ("Using this template") for everywhere else that needs renaming.
modId=chunkyidle
modGroup=dev.bikzxc
modVersion=0.1.0
modName=Chunky Idle
modDescription=Pauses running Chunky tasks when players join and resumes saved generation after the server is empty.
modAuthors=Bikzxc
modLicense=MIT

# Project identifiers from the Modrinth and CurseForge project pages.
modrinthProjectId=ECodck3H
curseforgeProjectId=1774779
# Nothing actually publishes until you pass -Ppublish.dryRun=false (in
# addition to setting the two project IDs above and the MODRINTH_TOKEN /
# CURSEFORGE_TOKEN environment variables) - see stonecutter.gradle.kts.
publish.dryRun=true
